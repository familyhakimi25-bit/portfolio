<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080c" />
    <script>
      // Apply the saved theme before first paint (no flash). Default is dark.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f7fb')
        }
      } catch (e) {}
    </script>
    <title>Muhamad Hakimi bin Awang · Cyber Security Portfolio</title>
    <meta name="description" content="Muhamad Hakimi bin Awang: final-year Cyber Security undergraduate at UPTM, based in Penang. Skills, certificates, experience, projects and security labs." />
    <meta property="og:title" content="Muhamad Hakimi bin Awang · Cyber Security Portfolio" />
    <meta property="og:description" content="Cyber security, networking, log analysis and web development. Skills, certificates, experience and projects." />
    <meta property="og:type" content="website" />
    <!-- After deploying, change this to the full address, e.g. https://your-name.vercel.app/og.jpg -->
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
